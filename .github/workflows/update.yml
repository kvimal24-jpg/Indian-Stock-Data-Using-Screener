name: Update Stock Data

on:
  workflow_dispatch: # Allows manual button click
  schedule:
    - cron: '0 14 * * *' # Runs daily at 7:30 PM IST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scrape.js
      - run: |
          git config user.name "DataBot"
          git config user.email "bot@example.com"
          git add master_data.json
          git commit -m "Daily Data Update" || exit 0
          git push
