name: Update Stock Data

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Scrape stock data
        run: node scrape.js

      - name: Split into per-company files + build index
        run: node split.cjs

      - name: Score changes and update history
        run: node score_and_log.cjs

      - name: Commit and push all outputs
        run: |
          git config user.name "NivesifyBot"
          git config user.email "bot@nivesify.in"
          git add master_data.json docs/data/ docs/history.json
          git commit -m "Data refresh $(date +'%Y-%m-%d')" || echo "No changes"
          git push