<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivesify — Indian Equity Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0C1220;--ink2:#3A4A62;--ink3:#7A8BA5;
  --paper:#F4F1E8;--paper2:#EDE9DC;--card:#FDFCF7;
  --bd:#D8D3C4;--bd2:#EAE6D8;
  --forest:#0A4A2E;--forest2:#1A6B42;--forestl:#E3F2EB;
  --amber:#92400E;--amber2:#B45309;--amberl:#FEF3C7;
  --navy:#1E3A8A;--navyl:#EFF6FF;
  --crimson:#991B1B;--crimsonl:#FEF2F2;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Instrument Sans','Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px;min-height:100vh}
button,input,select{font-family:var(--sans);cursor:pointer;border:none;outline:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--forestl);color:var(--forest)}
.fade{animation:fi .25s ease both}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
nav{background:var(--ink);position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(255,255,255,.06)}
.navi{max-width:1180px;margin:0 auto;padding:0 28px;height:52px;display:flex;align-items:center}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;color:#fff;cursor:pointer;background:none;padding:0;margin-right:28px}
.nlinks{display:flex;gap:2px;flex:1}
.nb{background:none;color:rgba(255,255,255,.4);font-size:13px;font-weight:500;padding:5px 11px;border-radius:5px;transition:all .15s}
.nb:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.06)}
.nb.on{color:#fff;background:rgba(255,255,255,.1)}
.nsig{display:flex;align-items:center;gap:7px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:#6B7280}
.dot.live{background:#22C55E;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.ntxt{font-size:11px;color:rgba(255,255,255,.35);font-family:var(--mono)}
.page{max-width:1180px;margin:0 auto;padding:40px 28px 80px}
.pgm{max-width:900px;margin:0 auto;padding:40px 28px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px 22px}
.csm{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:13px 15px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-buy{background:var(--forestl);color:var(--forest)}
.b-hold{background:var(--navyl);color:var(--navy)}
.b-watch{background:var(--amberl);color:var(--amber2)}
.b-avoid{background:var(--crimsonl);color:var(--crimson)}
.b-call{background:var(--forestl);color:var(--forest)}
.b-closed{background:var(--navyl);color:var(--navy)}
.slabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.stitle{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
.ssub{font-size:13px;color:var(--ink2);line-height:1.65;margin-top:5px}
.thesis{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.85;color:var(--ink)}
.body{font-size:13px;color:var(--ink2);line-height:1.68}
.srow{margin-bottom:9px}
.shead{display:flex;justify-content:space-between;margin-bottom:4px}
.slb{font-size:11px;color:var(--ink2)}
.svl{font-family:var(--mono);font-size:12px;font-weight:600}
.strk{height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.sfil{height:100%;border-radius:2px;transition:width .6s ease}
.tabs{display:flex;gap:3px;padding:3px;background:var(--paper2);border-radius:8px;border:1px solid var(--bd);width:fit-content;margin-bottom:22px}
.tbtn{padding:6px 14px;border:none;background:transparent;color:var(--ink2);border-radius:6px;font-size:12px;font-weight:500;transition:all .15s}
.tbtn.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sbox{padding:13px 15px;background:var(--paper2);border-radius:8px;border:1px solid var(--bd2)}
.slbl{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.sval{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.ssb{font-size:10px;color:var(--ink3);margin-top:2px}
.dl{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd2);border-radius:7px;margin-bottom:5px;background:var(--card)}
.dl:hover{border-color:var(--ink3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 11px;border-bottom:2px solid var(--bd);font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:var(--paper2)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.tbl .hov:hover td{background:var(--forestl);cursor:pointer}
.sinp{padding:8px 14px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-size:13px;color:var(--ink);width:240px}
.sinp:focus{border-color:var(--forest2)}
.ssel{padding:8px 12px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-size:12px;color:var(--ink2)}
.wstrip{background:var(--ink);color:#fff;border-radius:12px;padding:30px 34px;overflow:hidden;position:relative}
.heronum{font-family:var(--serif);font-size:96px;font-weight:300;line-height:1;letter-spacing:-.04em}
.pbtn{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);font-size:12px;color:var(--ink)}
.pbtn:hover{border-color:var(--ink3)}.pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#loader{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--forest2);display:inline-block;margin:0 3px;animation:ldot 1.2s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.2s}.ldot:nth-child(3){animation-delay:.4s}
@keyframes ldot{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
footer{border-top:1px solid var(--bd2);padding:22px 28px;margin-top:48px}
.fi{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
/* SPARKLINE */
.spark{display:inline-flex;align-items:flex-end;gap:1px;height:24px}
.spark span{width:4px;background:var(--forest2);border-radius:1px;opacity:.7;transition:height .3s}
@media(max-width:768px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.heronum{font-size:64px}}
</style>
</head>
<body>

<div id="loader">
  <div style="font-family:var(--serif);font-size:26px;font-weight:600;color:#fff;margin-bottom:20px">Nivesify</div>
  <div><span class="ldot"></span><span class="ldot"></span><span class="ldot"></span></div>
  <div style="font-size:12px;color:rgba(255,255,255,.35);margin-top:16px;font-family:var(--mono)" id="lmsg">Initialising...</div>
</div>

<nav>
  <div class="navi">
    <button class="logo" onclick="go('home')">Nivesify</button>
    <div class="nlinks">
      <button class="nb on" id="nb-home" onclick="go('home')">The Stance</button>
      <button class="nb" id="nb-calls" onclick="go('calls')">Calls</button>
      <button class="nb" id="nb-universe" onclick="go('universe')">Universe</button>
      <button class="nb" id="nb-record" onclick="go('record')">Record</button>
    </div>
    <div class="nsig">
      <div class="dot" id="ndot"></div>
      <span class="ntxt" id="ntxt">—</span>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer>
  <div class="fi">
    <div>
      <div style="font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:2px">Nivesify</div>
      <div style="font-size:11px;color:var(--ink3)">Conviction-first Indian equity research. All scores computed daily from live BSE filings via screener.in.</div>
    </div>
    <div style="font-size:11px;color:var(--ink3);text-align:right;line-height:1.7">
      <div>Not SEBI registered. Not financial advice.</div>
      <div>For educational &amp; research purposes only.</div>
    </div>
  </div>
</footer>

<script>
/* ══════════════════════════════════════════════════════
   NIVESIFY — fully dynamic from index.json + history.json
   No hardcoded data anywhere.
   Calls = auto-detected from scoring thresholds.
   Record = auto-built from history.json transitions.
══════════════════════════════════════════════════════ */

// ── STATE ────────────────────────────────────────────
let INDEX = {};
let HISTORY = { activeCalls:[], closedCalls:[], dailySnapshots:[], stats:{} };
let COS_LIST = [];
let page = 'home', coId = null, coData = null, coTab = 'overview';
let callTab = 'active';
let uniPage = 1, uniF = {q:'',signal:'',sector:''};
let charts = {};
const PER = 50;
const BASE = window.location.pathname.replace(/\/[^/]*$/, '');

// ── BOOT ─────────────────────────────────────────────
async function boot() {
  msg('Loading data...');
  try {
    const ts = '?v=' + Date.now();
    const [hRes, iRes] = await Promise.all([
      fetch(BASE + '/history.json' + ts),
      fetch(BASE + '/data/index.json' + ts),
    ]);

    // history.json may not exist on first run
    if (hRes.ok) {
      HISTORY = await hRes.json();
    } else {
      console.warn('history.json not found — first run?');
    }

    INDEX = await iRes.json();
    COS_LIST = Object.values(INDEX).sort((a,b) => b.ccs - a.ccs);

    const n = (HISTORY.activeCalls || []).length;
    document.getElementById('ndot').className = 'dot' + (n > 0 ? ' live' : '');
    document.getElementById('ntxt').textContent = n + ' active call' + (n !== 1 ? 's' : '');
    msg('Loaded ' + COS_LIST.length + ' companies');
    setTimeout(hideLoader, 250);
    r();
  } catch(e) {
    msg('Error: ' + e.message);
    console.error(e);
  }
}
function msg(m){document.getElementById('lmsg').textContent=m;}
function hideLoader(){const l=document.getElementById('loader');l.style.opacity='0';setTimeout(()=>l.remove(),400);}

// ── ROUTING ───────────────────────────────────────────
function go(p){
  page=p;coId=null;coData=null;coTab='overview';uniPage=1;uniF={q:'',signal:'',sector:''};
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+p);if(nb)nb.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});r();
}
async function goC(id){
  coId=id;coData=null;page='company';coTab='overview';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('nb-universe').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});r();
  try{
    const res = await fetch(BASE+'/data/'+id+'.json?v='+Date.now());
    coData = await res.json();
    r();
  }catch(e){console.warn('Company file not found:',id);}
}
function setCoTab(t){coTab=t;r();}
function setCallTab(t){callTab=t;r();}

// ── RENDER ────────────────────────────────────────────
function r(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="fade">${renderPage()}</div>`;
  setTimeout(drawCharts,80);
}
function renderPage(){
  if(page==='home')return renderHome();
  if(page==='calls')return renderCalls();
  if(page==='universe')return renderUniverse();
  if(page==='company')return renderCompany();
  if(page==='record')return renderRecord();
  return '';
}

// ── HELPERS ───────────────────────────────────────────
const sigC=s=>({BUY:'var(--forest)',HOLD:'var(--navy)',WATCH:'var(--amber2)',AVOID:'var(--crimson)'}[s]||'var(--ink2)');
const sigCls=s=>({BUY:'b-buy',HOLD:'b-hold',WATCH:'b-watch',AVOID:'b-avoid'}[s]||'');
const bdg=(l,c)=>`<span class="badge ${c}">${l}</span>`;
const fmtCr=n=>{if(n==null)return'—';const a=Math.abs(n);const s=a>=100000?`${(a/100000).toFixed(1)}L Cr`:a>=1000?`${(a/1000).toFixed(0)}K Cr`:`${Math.round(a)} Cr`;return(n<0?'−₹':'₹')+s;};
const pn=v=>{if(v==null)return null;if(typeof v==='number')return v;return parseFloat(String(v).replace('%','').replace(',',''))||null;};
const lN=(obj,n)=>{if(!obj)return[];return Object.values(obj).slice(-n).map(pn).filter(v=>v!=null);};
const sb=(l,v,c)=>`<div class="srow"><div class="shead"><span class="slb">${l}</span><span class="svl" style="color:${c}">${v}/100</span></div><div class="strk"><div class="sfil" style="width:${v}%;background:${c}"></div></div></div>`;
const fmtDate=d=>{if(!d)return'—';const [y,m,dy]=d.split('-');const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${dy} ${months[parseInt(m)-1]} ${y}`;};
const evmedNum=v=>{if(!v)return null;return parseInt(String(v).replace('+',''));};

// ── HOME ──────────────────────────────────────────────
function renderHome(){
  const activeCalls = HISTORY.activeCalls || [];
  const snap = (HISTORY.dailySnapshots||[]).slice(-1)[0] || {};
  const lastUpdated = HISTORY.lastUpdated || 'Not yet run';
  const topCall = activeCalls[0] ? INDEX[activeCalls[0].id] : null;
  const callMeta = activeCalls[0] || null;

  return `<div class="page">
    <div style="display:grid;grid-template-columns:1fr 380px;gap:48px;margin-bottom:52px;align-items:start">
      <div>
        ${topCall && callMeta ? `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--forest2)"></div>
            ${bdg(activeCalls.length+' Active Call'+(activeCalls.length!==1?'s':''),'b-call')}
          </div>
          <h1 style="font-family:var(--serif);font-size:56px;font-weight:500;line-height:1.06;color:var(--ink);margin-bottom:18px;letter-spacing:-.025em">${topCall.name}<span style="color:var(--forest2)">.</span></h1>
          <div style="font-size:13px;color:var(--ink2);margin-bottom:8px">${topCall.sector} · BSE ${topCall.id}</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px">
            ${[['Q-Score',callMeta.entryScores.qScore,'var(--forest2)'],['V-Score',callMeta.entryScores.vScore,'var(--navy)'],['M-Score',callMeta.entryScores.mScore,'#7C3AED'],['CCS',callMeta.entryScores.ccs,sigC(topCall.signal)]].map(([l,v,c])=>`
              <div class="sbox"><div class="slbl">${l}</div><div class="sval" style="color:${c}">${v}</div></div>`).join('')}
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button onclick="go('calls')" style="padding:11px 24px;background:var(--ink);color:#fff;border-radius:7px;font-size:13px;font-weight:600">View all calls &rarr;</button>
            <button onclick="goC('${topCall.id}')" style="padding:11px 20px;background:transparent;color:var(--ink);border:1px solid var(--bd);border-radius:7px;font-size:13px">Deep dive &amp; charts</button>
          </div>
        ` : `
          <div class="slabel" style="margin-bottom:16px">Current stance</div>
          <div class="heronum" style="color:var(--bd);margin-bottom:14px">0<span style="opacity:.4">.</span></div>
          <p class="body" style="max-width:440px;font-size:14px;margin-bottom:16px">
            No stocks currently meet all conviction thresholds simultaneously. The engine is scanning <strong>${COS_LIST.length.toLocaleString()}</strong> companies. 
            ${COS_LIST.filter(c=>c.signal==='WATCH').length} are on watch. None have cleared every bar yet.
          </p>
          <p class="body" style="max-width:440px;font-size:13px;color:var(--ink3)">
            Conviction thresholds: Signal = BUY · Q-Score ≥ 60 · CCS ≥ 65 · EV-MED ≥ +5. All four must align simultaneously.
          </p>
        `}
      </div>
      <div>
        ${topCall && callMeta ? `
        <div class="card">
          <div class="slabel" style="margin-bottom:6px">Engine signal</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <span style="font-family:var(--serif);font-size:15px;font-weight:600">${topCall.name}</span>
            ${bdg(topCall.signal,sigCls(topCall.signal))}
          </div>
          ${sb('Q-Score — Quality',callMeta.entryScores.qScore,'var(--forest2)')}
          ${sb('V-Score — Value',callMeta.entryScores.vScore,'var(--navy)')}
          ${sb('M-Score — Momentum',callMeta.entryScores.mScore,'#7C3AED')}
          <div style="border-top:1px solid var(--bd2);padding-top:11px;margin-top:4px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--ink2)">Conviction Score (CCS)</span>
            <span style="font-family:var(--mono);font-size:24px;font-weight:600;color:${sigC(topCall.signal)}">${callMeta.entryScores.ccs}<span style="font-size:10px;opacity:.4">/100</span></span>
          </div>
          <div class="g2" style="margin-top:11px">
            <div class="sbox"><div class="slbl">EV-MED</div><div class="sval" style="color:var(--forest2)">${callMeta.entryScores.evmed||'—'}</div><div class="ssb">Earnings vs Price gap</div></div>
            <div class="sbox"><div class="slbl">Call opened</div><div class="sval" style="font-size:13px">${fmtDate(callMeta.entryDate)}</div><div class="ssb">Auto-detected</div></div>
          </div>
        </div>` : `
        <div class="card">
          <div class="slabel" style="margin-bottom:12px">Highest conviction — Watch list</div>
          ${COS_LIST.filter(c=>c.signal==='WATCH'||c.signal==='BUY').slice(0,5).map(c=>`
            <div onclick="goC('${c.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd2);cursor:pointer">
              <div><div style="font-size:13px;font-weight:500">${c.name}</div><div style="font-size:10px;color:var(--ink3)">${c.sector}</div></div>
              <div style="display:flex;align-items:center;gap:8px">${bdg(c.signal,sigCls(c.signal))}<span style="font-family:var(--mono);font-weight:600;color:${sigC(c.signal)}">${c.ccs}</span></div>
            </div>`).join('')}
          <div style="padding-top:10px;font-size:11px;color:var(--ink3)">Updated ${lastUpdated}. Engine re-scores daily.</div>
        </div>`}
      </div>
    </div>

    <!-- WISDOM -->
    <div class="wstrip" style="margin-bottom:48px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px">
        ${[
          ['"Price is what you pay. Value is what you get."','Warren Buffett','The EV-MED metric quantifies this. When profit CAGR exceeds price CAGR by 5%+ over 5 years, value is accumulating unseen.'],
          ['"The market is a voting machine short-term, a weighing machine long-term."','Benjamin Graham','The V-Score measures the divergence. A high positive divergence between earnings growth and price growth is the signal.'],
          ['"All you need for a lifetime of successful investing is a few big winners."','Peter Lynch','That is why conviction calls are rare. The engine waits for all four thresholds to align simultaneously. Most days the answer is zero.']
        ].map(([q,a,n])=>`<div><p style="font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.75;color:rgba(255,255,255,.82);margin-bottom:7px">${q}</p><div style="font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px">— ${a}</div><div style="font-size:11px;color:rgba(255,255,255,.38);line-height:1.6;padding-top:7px;border-top:1px solid rgba(255,255,255,.07)">${n}</div></div>`).join('')}
      </div>
    </div>

    <!-- LIVE STATS -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px">
      <div><div class="slabel">Live Coverage</div><div class="stitle" style="font-size:21px">${COS_LIST.length.toLocaleString()} companies · Updated ${lastUpdated}</div></div>
      <button onclick="go('universe')" style="padding:7px 15px;background:transparent;border:1px solid var(--bd);border-radius:6px;font-size:12px;color:var(--ink)">Full research table &rarr;</button>
    </div>
    <div class="g4" style="margin-bottom:28px">
      ${[
        ['BUY signals',COS_LIST.filter(c=>c.signal==='BUY').length,'var(--forest2)','Meets quality threshold'],
        ['WATCH list',COS_LIST.filter(c=>c.signal==='WATCH').length,'var(--amber2)','Building toward a call'],
        ['AVOID',COS_LIST.filter(c=>c.signal==='AVOID').length,'var(--crimson)','Below quality bar'],
        ['Active calls',(HISTORY.activeCalls||[]).length,'var(--forest2)','Passes all 4 thresholds'],

function renderCoOv(co,full,isBank,qKeys,qs,pl,ra,cag,isCall){
  if(!full)return'<p class="body" style="padding:20px 0">Loading data...</p>';
  const qEPS=qKeys.map(h=>pn(qs['EPS in Rs']?.[h]));
  const qOPM=isBank?qKeys.map(h=>pn(qs['Financing Margin %']?.[h])):qKeys.map(h=>pn(qs['OPM %']?.[h]));
  const qGNPA=isBank?qKeys.map(h=>pn(qs['Gross NPA %']?.[h])):[];
  const qNNPA=isBank?qKeys.map(h=>pn(qs['Net NPA %']?.[h])):[];
  const latEPS=qEPS.filter(v=>v!=null).slice(-1)[0];
  const prevEPS=qEPS.filter(v=>v!=null).slice(-5,-4)[0];
  const epsYoY=(latEPS!=null&&prevEPS!=null&&prevEPS!==0)?((latEPS-prevEPS)/Math.abs(prevEPS)*100).toFixed(1)+'%':'—';
  const pros=full?.analysis?.pros||[];
  const cons=full?.analysis?.cons||[];
  const callRecord=(HISTORY.activeCalls||[]).find(c=>c.id===co.id);

  return `<div class="g2" style="margin-bottom:14px">
    <div class="card">
      <div class="slabel" style="margin-bottom:8px">Quarterly EPS — ₹</div>
      <div style="position:relative;height:140px"><canvas id="co-qeps"></canvas></div>

  const vindicated = closedCalls.filter(c =>
    c.exitScores?.signal === 'HOLD' || c.priceCagr1YAtExit > 0
  ).length;
  const hitRate = closedCalls.length > 0
    ? Math.round(vindicated / closedCalls.length * 100) + '%'

}

const COPT={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0C1220',titleColor:'rgba(255,255,255,.45)',bodyColor:'#fff',padding:9,cornerRadius:6}},scales:{x:{ticks:{color:'#7A8BA5',font:{size:9,family:'JetBrains Mono'}},grid:{display:false},border:{display:false}},y:{ticks:{color:'#7A8BA5',font:{size:9,family:'JetBrains Mono'}},grid:{color:'#EAE6D8'},border:{display:false}}}};
function dc(id){if(charts[id]){try{charts[id].destroy();}catch(e){}delete charts[id];}}
function mkL(id,labels,data,name,clr){const el=document.getElementById(id);if(!el)return;dc(id);charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:name,data,borderColor:clr,borderWidth:2.5,pointRadius:0,tension:.35,fill:true,backgroundColor:clr+'18'}]},options:{...COPT}});}
function mkDual(id,labels,d1,n1,c1,d2,n2,c2){const el=document.getElementById(id);if(!el)return;dc(id);charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:n1,data:d1,borderColor:c1,borderWidth:2,pointRadius:0,tension:.35},{label:n2,data:d2,borderColor:c2,borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.35}]},options:{...COPT}});}
function mkBL(id,labels,bars,bN,line,lN){const el=document.getElementById(id);if(!el)return;dc(id);charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{type:'bar',label:bN,data:bars,backgroundColor:'#DDD8C4',borderRadius:3,barPercentage:.6},{type:'line',label:lN,data:line,borderColor:'#0A4A2E',borderWidth:2.5,pointRadius:0,tension:.3,yAxisID:'y1'}]},options:{...COPT,scales:{...COPT.scales,y1:{position:'right',ticks:{color:'#0A4A2E',font:{size:9}},grid:{display:false},border:{display:false}}}}});}
function mkBs(id,labels,d1,n1,d2,n2){const el=document.getElementById(id);if(!el)return;dc(id);charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:n1,data:d1,backgroundColor:'#0A4A2E',borderRadius:3,barPercentage:.5},{label:n2,data:d2,backgroundColor:'#1A6B42',borderRadius:3,barPercentage:.5}]},options:{...COPT}});}
function mkOwn(id,labels,fii,dii,prom){const el=document.getElementById(id);if(!el)return;dc(id);const ds=[{label:'FII %',data:fii,borderColor:'#1E3A8A',borderWidth:2,pointRadius:3,tension:.3},{label:'DII %',data:dii,borderColor:'#0A4A2E',borderWidth:2,pointRadius:3,tension:.3}];if(prom.some(v=>v!=null&&v>0))ds.push({label:'Promoter %',data:prom,borderColor:'#7C3AED',borderWidth:2,pointRadius:3,tension:.3});charts[id]=new Chart(el,{type:'line',data:{labels,datasets:ds},options:{...COPT}});}

function drawCharts(){
  Object.keys(charts).forEach(k=>{try{charts[k].destroy();}catch(e){}delete charts[k];});
  if(page!=='company'||!coData)return;
  const full=coData;
  const qs=full.quarters?.data||{};
  const isBank=full._scores?.isBank||false;
  const qKeys=full.quarters?.headers||[];
  const shKeys=(full.shareholding?.headers||[]).filter(h=>h&&h.trim());
  const sh=full.shareholding?.data||{};
  const pl=full.profitLoss?.data||{};
  const ra=full.ratios?.data||{};
  const cf=full.cashFlow?.data||{};
  const annKeys=full.profitLoss?.headers||[];
  const cfKeys=full.cashFlow?.headers||[];
  const disp=k=>k.replace('Mar ','FY');

  if(coTab==='overview'){
    mkL('co-qeps',qKeys,qKeys.map(h=>pn(qs['EPS in Rs']?.[h])),'EPS ₹','#0A4A2E');
    if(isBank) mkDual('co-margin',qKeys,qKeys.map(h=>pn(qs['Gross NPA %']?.[h])),'Gross NPA %','#92400E',qKeys.map(h=>pn(qs['Net NPA %']?.[h])),'Net NPA %','#991B1B');
    else mkL('co-margin',qKeys,qKeys.map(h=>pn(qs['OPM %']?.[h])),'OPM %','#1E3A8A');
  }
  if(coTab==='financials'){
    mkBL('co-revnp',annKeys.map(disp),annKeys.map(y=>pn((isBank?pl['Revenue']:pl['Sales'])?.[y])),isBank?'Revenue':'Sales',annKeys.map(y=>pn(pl['Net Profit']?.[y])),'Net Profit');
    mkBs('co-cf',cfKeys.map(disp),cfKeys.map(y=>pn(cf['Cash from Operating Activity']?.[y])),'CFO',cfKeys.map(y=>pn(cf['Free Cash Flow']?.[y])),'FCF');
  }
  if(coTab==='ownership') mkOwn('co-own',shKeys,shKeys.map(h=>pn(sh['FIIs']?.[h])),shKeys.map(h=>pn(sh['DIIs']?.[h])),shKeys.map(h=>pn(sh['Promoters']?.[h])));
}

window.go=go;window.goC=goC;window.setCoTab=setCoTab;window.setCallTab=setCallTab;
boot();
</script>
