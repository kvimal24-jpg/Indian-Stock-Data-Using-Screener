<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivesify — Indian Equity Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0C1220;--ink2:#3A4A62;--ink3:#7A8BA5;--ink4:#B8C4D4;
  --paper:#F4F1E8;--paper2:#EDE9DC;--card:#FDFCF7;
  --bd:#D8D3C4;--bd2:#EAE6D8;
  --forest:#0A4A2E;--forest2:#1A6B42;--forestl:#E3F2EB;
  --amber:#92400E;--amber2:#B45309;--amberl:#FEF3C7;
  --navy:#1E3A8A;--navyl:#EFF6FF;
  --crimson:#991B1B;--crimsonl:#FEF2F2;
  --gold:#A16207;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Instrument Sans','Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px;min-height:100vh}
button,input,select{font-family:var(--sans);cursor:pointer;border:none;outline:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--forestl);color:var(--forest)}
.fade{animation:fi .25s ease both}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* NAV */
nav{background:var(--ink);position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(255,255,255,.06)}
.nav-inner{max-width:1180px;margin:0 auto;padding:0 28px;height:52px;display:flex;align-items:center;gap:0}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;color:#fff;cursor:pointer;background:none;padding:0;margin-right:28px}
.nav-links{display:flex;gap:2px;flex:1}
.nbtn{background:none;color:rgba(255,255,255,.4);font-size:13px;font-weight:500;padding:5px 11px;border-radius:5px;transition:all .15s}
.nbtn:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.06)}
.nbtn.on{color:#fff;background:rgba(255,255,255,.1)}
.npulse{display:flex;align-items:center;gap:7px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:#6B7280}
.dot.live{background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.4);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.nsig{font-size:11px;color:rgba(255,255,255,.35);font-family:var(--mono)}
/* LAYOUT */
.page{max-width:1180px;margin:0 auto;padding:40px 28px 80px}
.pgm{max-width:860px;margin:0 auto;padding:40px 28px 80px}
/* CARDS */
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px 22px}
.csm{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:13px 15px}
/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-buy{background:var(--forestl);color:var(--forest)}
.b-hold{background:var(--navyl);color:var(--navy)}
.b-watch{background:var(--amberl);color:var(--amber2)}
.b-avoid{background:var(--crimsonl);color:var(--crimson)}
.b-active{background:var(--forestl);color:var(--forest)}
.b-building{background:var(--forestl);color:var(--forest)}
.b-watching{background:var(--amberl);color:var(--amber2)}
.b-cooling{background:#FFF7ED;color:#C2410C}
/* TYPOGRAPHY */
.slabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.stitle{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.15}
.ssub{font-size:13px;color:var(--ink2);line-height:1.65;margin-top:5px}
.thesis{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.85;color:var(--ink)}
.body{font-size:13px;color:var(--ink2);line-height:1.68}
/* SCORE BAR */
.srow{margin-bottom:9px}
.shead{display:flex;justify-content:space-between;margin-bottom:4px}
.slb{font-size:11px;color:var(--ink2)}
.svl{font-family:var(--mono);font-size:12px;font-weight:600}
.strk{height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.sfil{height:100%;border-radius:2px;transition:width .6s ease}
/* TABS */
.tabs{display:flex;gap:3px;padding:3px;background:var(--paper2);border-radius:8px;border:1px solid var(--bd);width:fit-content;margin-bottom:22px}
.tbtn{padding:6px 14px;border:none;background:transparent;color:var(--ink2);border-radius:6px;font-size:12px;font-weight:500;transition:all .15s}
.tbtn.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* STAT */
.sbox{padding:13px 15px;background:var(--paper2);border-radius:8px;border:1px solid var(--bd2)}
.slbl{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.sval{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.ssb{font-size:10px;color:var(--ink3);margin-top:2px}
/* DOC LINK */
.dl{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd2);border-radius:7px;margin-bottom:5px;transition:border-color .15s;background:var(--card);cursor:pointer}
.dl:hover{border-color:var(--ink3)}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 11px;border-bottom:2px solid var(--bd);font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:var(--paper2)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.tbl tr.hov:hover td{background:var(--forestl);cursor:pointer}
/* SEARCH */
.srch{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sinp{padding:8px 14px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-size:13px;color:var(--ink);width:260px;transition:border-color .15s}
.sinp:focus{border-color:var(--forest2)}
.ssel{padding:8px 12px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-size:12px;color:var(--ink2)}
/* WISDOM */
.wstrip{background:var(--ink);color:#fff;border-radius:12px;padding:30px 34px;position:relative;overflow:hidden}
.wstrip::before{content:'';position:absolute;top:-50px;right:-50px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.02)}
/* HERO */
.heronum{font-family:var(--serif);font-size:96px;font-weight:300;line-height:1;letter-spacing:-.04em}
/* LOADER */
#loader{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--forest2);display:inline-block;margin:0 3px;animation:ldot 1.2s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.2s}.ldot:nth-child(3){animation-delay:.4s}
@keyframes ldot{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
/* PAGINATION */
.pag{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:18px}
.pbtn{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);font-size:12px;color:var(--ink);transition:all .15s}
.pbtn:hover{border-color:var(--ink3)}.pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* FOOTER */
footer{border-top:1px solid var(--bd2);padding:22px 28px;margin-top:48px}
.fi{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
@media(max-width:768px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.heronum{font-size:64px}nav .nav-links .nbtn:nth-child(n+4){display:none}}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;color:#fff;margin-bottom:20px">Nivesify</div>
  <div><span class="ldot"></span><span class="ldot"></span><span class="ldot"></span></div>
  <div style="font-size:12px;color:rgba(255,255,255,.35);margin-top:16px;font-family:'JetBrains Mono',monospace" id="lmsg">Loading universe...</div>
</div>

<!-- NAV -->
<nav id="mnav">
  <div class="nav-inner">
    <button class="logo" onclick="go('home')">Nivesify</button>
    <div class="nav-links">
      <button class="nbtn on" id="nb-home" onclick="go('home')">The Stance</button>
      <button class="nbtn" id="nb-calls" onclick="go('calls')">Calls</button>
      <button class="nbtn" id="nb-universe" onclick="go('universe')">Universe</button>
      <button class="nbtn" id="nb-record" onclick="go('record')">Record</button>
    </div>
    <div class="npulse">
      <div class="dot" id="ndot"></div>
      <span class="nsig" id="nsigtxt">loading...</span>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer>
  <div class="fi">
    <div>
      <div style="font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:2px">Nivesify</div>
      <div style="font-size:11px;color:var(--ink3)">Conviction-first Indian equity research. Data from screener.in via daily automated pipeline.</div>
    </div>
    <div style="font-size:11px;color:var(--ink3);text-align:right;line-height:1.7">
      <div>Not SEBI registered. Not financial advice.</div>
      <div>For educational purposes only.</div>
    </div>
  </div>
</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   NIVESIFY FRONTEND
   Data source: ./data/index.json + ./data/{ticker}.json
   Updated daily via GitHub Actions
══════════════════════════════════════════════════════════════ */

// ─── CALLS DATA (edit this manually when you issue a call) ─────
const CALLS_DATA = {
  active: [
    // Example — fill in your own calls here:
    // {
    //   id: "500180",
    //   callDate: "18 Jan 2026",
    //   horizon: "18–24 months",
    //   contraType: "Neglected Quality",
    //   thesis: "Write your full thesis here...",
    //   contraView: "Steelmanned bear case...",
    //   invalidation: "Specific criteria that would close this call..."
    // }
  ],
  archived: [
    {name:"Titan Company",type:"Neglected Quality",opened:"Mar 2024",closed:"Sep 2024",ret:"+38% vs Nifty",notes:"Premium brand punished post-Zoya controversy. Business never broke. Re-rated within 6 months. Lesson: quality business reputation recovers faster than its stock price."},
    {name:"Bajaj Finance",type:"Earnings Inflection",opened:"Oct 2022",closed:"Apr 2023",ret:"+24% vs Nifty",notes:"Post-COVID NPA fears priced in too long. Two consecutive clean quarters confirmed the turn. Exited on valuation."},
    {name:"IRCTC",type:"Priced for Perfection",opened:"Nov 2021",closed:"May 2022",ret:"+19% drawdown avoided",notes:"PE 180×, growth plateauing. Called the correction; stock fell 35%. Lesson: even a monopoly is not worth any price."}
  ]
};

// ─── STATE ────────────────────────────────────────────────────
let INDEX = {};   // full index loaded once
let COS_LIST = []; // sorted array
let page = 'home';
let coId = null;
let coData = null;  // individual company data (loaded on demand)
let coTab = 'overview';
let callTab = 'active';
let charts = {};
let uniPage = 1;
let uniFilter = {search:'',signal:'',sector:''};
const PER_PAGE = 50;

// ─── BOOT ─────────────────────────────────────────────────────
async function boot() {
  setMsg('Fetching universe data...');
  try {
    const resp = await fetch('./data/index.json');
    INDEX = await resp.json();
    COS_LIST = Object.values(INDEX).sort((a,b) => b.ccs - a.ccs);
    setMsg(`Loaded ${COS_LIST.length} companies`);
    const activeIds = CALLS_DATA.active.map(c => c.id);
    document.getElementById('ndot').className = 'dot' + (activeIds.length ? ' live' : '');
    document.getElementById('nsigtxt').textContent = `${activeIds.length} active call${activeIds.length!==1?'s':''}`;
    setTimeout(hideLoader, 300);
    r();
  } catch(e) {
    setMsg('Error loading data. Check console.');
    console.error(e);
  }
}

function setMsg(m){document.getElementById('lmsg').textContent = m;}
function hideLoader(){const l=document.getElementById('loader');l.style.opacity='0';setTimeout(()=>l.remove(),400);}

// ─── NAV ──────────────────────────────────────────────────────
function go(p){
  page=p; coId=null; coData=null; coTab='overview';
  uniPage=1; uniFilter={search:'',signal:'',sector:''};
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+p); if(nb) nb.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'}); r();
}
async function goC(id){
  coId=id; page='company'; coTab='overview';
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('nb-universe').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'}); r();
  // Load full company data in background
  try {
    const resp = await fetch('./data/'+id+'.json');
    coData = await resp.json();
    r(); // re-render with full data
  } catch(e) { console.warn('Could not load company data for',id); }
}
function setCoTab(t){coTab=t;r();}
function setCallTab(t){callTab=t;r();}

// ─── MAIN RENDER ──────────────────────────────────────────────
function r(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="fade">${renderPage()}</div>`;
  setTimeout(()=>drawCharts(),80);
}

function renderPage(){
  if(page==='home') return renderHome();
  if(page==='calls') return renderCalls();
  if(page==='universe') return renderUniverse();
  if(page==='company') return renderCompany();
  if(page==='record') return renderRecord();
  return '';
}

// ─── HELPERS ──────────────────────────────────────────────────
function sigC(s){return{BUY:'var(--forest)',HOLD:'var(--navy)',WATCH:'var(--amber2)',AVOID:'var(--crimson)'}[s]||'var(--ink2)'}
function sigCls(s){return{BUY:'b-buy',HOLD:'b-hold',WATCH:'b-watch',AVOID:'b-avoid'}[s]||''}
function radCls(s){return{Building:'b-building',Watching:'b-watching',Cooling:'b-cooling'}[s]||''}
function bdg(l,cls){return`<span class="badge ${cls}">${l}</span>`}
function fmtCr(n){if(n==null)return'—';const a=Math.abs(n);let s=a>=100000?`${(a/100000).toFixed(1)}L Cr`:a>=1000?`${(a/1000).toFixed(0)}K Cr`:`${Math.round(a)} Cr`;return(n<0?'−₹':'₹')+s}
function parseNum(v){if(v==null)return null;if(typeof v==='number')return v;return parseFloat(String(v).replace('%','').replace(',',''))||null}
function lastN(obj,n){if(!obj)return[];return Object.values(obj).slice(-n).map(parseNum).filter(v=>v!=null)}
function lastKeys(obj,n){if(!obj)return[];const keys=Object.keys(obj);return keys.slice(-n)}
function scoreBar(l,v,cl){return`<div class="srow"><div class="shead"><span class="slb">${l}</span><span class="svl" style="color:${cl}">${v}/100</span></div><div class="strk"><div class="sfil" style="width:${v}%;background:${cl}"></div></div></div>`}

// ─── HOME PAGE ────────────────────────────────────────────────
function renderHome(){
  const active = CALLS_DATA.active;
  const topCo = active.length ? INDEX[active[0].id] : null;
  const callMeta = active.length ? active[0] : null;
  const radar = COS_LIST.filter(c => c.signal === 'WATCH' || c.signal === 'HOLD').slice(0,4);

  return `<div class="page">
    <!-- HERO -->
    <div style="display:grid;grid-template-columns:1fr 380px;gap:48px;margin-bottom:52px;align-items:start">
      <div>
        ${topCo && callMeta ? `
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--forest2)"></div>
            ${bdg('1 Active Call','b-active')} ${bdg(callMeta.contraType,'b-watching')}
          </div>
          <h1 style="font-family:var(--serif);font-size:56px;font-weight:500;line-height:1.06;color:var(--ink);margin-bottom:20px;letter-spacing:-.025em">${topCo.name}<span style="color:var(--forest2)">.</span></h1>
          <p class="thesis" style="max-width:500px;margin-bottom:26px;font-size:15px">&ldquo;${callMeta.thesis.substring(0,200)}...&rdquo;</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button onclick="go('calls')" style="padding:11px 24px;background:var(--ink);color:#fff;border-radius:7px;font-size:13px;font-weight:600">Read full thesis &rarr;</button>
            <button onclick="goC('${topCo.id}')" style="padding:11px 20px;background:transparent;color:var(--ink);border:1px solid var(--bd);border-radius:7px;font-size:13px">All charts &amp; data</button>
          </div>
        ` : `
          <div class="slabel" style="margin-bottom:16px">Current stance</div>
          <div class="heronum" style="color:var(--bd);margin-bottom:14px">0<span style="opacity:.4">.</span></div>
          <p class="body" style="max-width:440px;font-size:14px">No active calls. Watching ${COS_LIST.filter(c=>c.signal==='WATCH').length} situations. None have cleared the conviction threshold. Sitting still is a position — often the most profitable one.</p>
        `}
      </div>
      <div>
        ${topCo && callMeta ? `
        <div class="card">
          <div class="slabel" style="margin-bottom:6px">Quant-Mental Scores</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <span style="font-family:var(--serif);font-size:15px;font-weight:600">${topCo.name}</span>
            ${bdg(topCo.signal,sigCls(topCo.signal))}
          </div>
          ${scoreBar('Q-Score — Quality',topCo.qScore,'var(--forest2)')}
          ${scoreBar('V-Score — Value',topCo.vScore,'var(--navy)')}
          ${scoreBar('M-Score — Momentum',topCo.mScore,'#7C3AED')}
          <div style="border-top:1px solid var(--bd2);padding-top:11px;margin-top:4px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--ink2)">Conviction Score (CCS)</span>
            <span style="font-family:var(--mono);font-size:24px;font-weight:600;color:${sigC(topCo.signal)}">${topCo.ccs}<span style="font-size:10px;opacity:.4">/100</span></span>
          </div>
          <div class="g2" style="margin-top:11px">
            <div class="sbox"><div class="slbl">EV-MED Signal</div><div class="sval" style="color:var(--forest2)">${topCo.evmed||'—'}</div><div class="ssb">Earnings vs Price</div></div>
            <div class="sbox"><div class="slbl">Call Horizon</div><div class="sval" style="font-size:13px">${callMeta.horizon}</div><div class="ssb">${callMeta.callDate}</div></div>
          </div>
        </div>` : `
        <div class="card">
          <div class="slabel" style="margin-bottom:12px">Highest conviction watch — ${radar.length} situations</div>
          ${radar.map(c=>`<div onclick="goC('${c.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd2);cursor:pointer">
            <div><div style="font-size:13px;font-weight:500">${c.name}</div><div style="font-size:10px;color:var(--ink3)">${c.sector}</div></div>
            <div style="display:flex;align-items:center;gap:8px">${bdg(c.signal,sigCls(c.signal))}<span style="font-family:var(--mono);font-size:13px;font-weight:600;color:${sigC(c.signal)}">${c.ccs}</span></div>
          </div>`).join('')}
        </div>`}
      </div>
    </div>

    <!-- WISDOM -->
    <div class="wstrip" style="margin-bottom:48px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px">
        ${[
          ['"Price is what you pay. Value is what you get."','Warren Buffett','The EV-MED filter quantifies this: when a company\'s earnings CAGR exceeds its price CAGR over 5 years, value is accumulating unseen.'],
          ['"The market is a voting machine short-term, a weighing machine long-term."','Benjamin Graham','Our V-Score measures the gap between the vote count (price) and the weight (earnings). A high divergence is the signal.'],
          ['"Go for a business any fool can run — because someday a fool will."','Charlie Munger','The Q-Score\'s ROE consistency test operationalises this. A business with 15%+ ROE for 8 straight years needs no genius at the helm.']
        ].map(([q,a,n])=>`<div><p style="font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.75;color:rgba(255,255,255,.82);margin-bottom:7px">${q}</p><div style="font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px">— ${a}</div><div style="font-size:11px;color:rgba(255,255,255,.38);line-height:1.6;padding-top:7px;border-top:1px solid rgba(255,255,255,.07)">${n}</div></div>`).join('')}
      </div>
    </div>

    <!-- UNIVERSE SNAP -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px">
      <div><div class="slabel">Live Coverage</div><div class="stitle" style="font-size:21px">${COS_LIST.length.toLocaleString()} companies tracked</div></div>
      <button onclick="go('universe')" style="padding:7px 15px;background:transparent;border:1px solid var(--bd);border-radius:6px;font-size:12px;color:var(--ink)">Full research table &rarr;</button>

// ─── CHARTS ──────────────────────────────────────────────────
function dChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
const COPT = {
  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#0C1220',titleColor:'rgba(255,255,255,.45)',bodyColor:'#fff',padding:9,cornerRadius:6}},
  scales:{x:{ticks:{color:'#7A8BA5',font:{size:9,family:'JetBrains Mono'}},grid:{display:false},border:{display:false}},y:{ticks:{color:'#7A8BA5',font:{size:9,family:'JetBrains Mono'}},grid:{color:'#EAE6D8'},border:{display:false}}}
};

function mkLine(id,labels,data,name,clr,fill=true){
  const el=document.getElementById(id);if(!el)return;dChart(id);
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:name,data,borderColor:clr,borderWidth:2.5,pointRadius:0,tension:.35,fill,backgroundColor:clr+'18'}]},options:{...COPT}});
}
function mkDual(id,labels,d1,n1,c1,d2,n2,c2){
  const el=document.getElementById(id);if(!el)return;dChart(id);
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:n1,data:d1,borderColor:c1,borderWidth:2,pointRadius:0,tension:.35},{label:n2,data:d2,borderColor:c2,borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.35}]},options:{...COPT}});
}
function mkBarLine(id,labels,bars,bN,line,lN){
  const el=document.getElementById(id);if(!el)return;dChart(id);
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{type:'bar',label:bN,data:bars,backgroundColor:'#DDD8C4',borderRadius:3,barPercentage:.6},{type:'line',label:lN,data:line,borderColor:'#0A4A2E',borderWidth:2.5,pointRadius:0,tension:.3,yAxisID:'y1'}]},options:{...COPT,scales:{...COPT.scales,y1:{position:'right',ticks:{color:'#0A4A2E',font:{size:9}},grid:{display:false},border:{display:false}}}}});
}
function mkBars(id,labels,d1,n1,d2,n2){
  const el=document.getElementById(id);if(!el)return;dChart(id);
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:n1,data:d1,backgroundColor:'#0A4A2E',borderRadius:3,barPercentage:.5},{label:n2,data:d2,backgroundColor:'#1A6B42',borderRadius:3,barPercentage:.5}]},options:{...COPT}});
}
function mkOwn(id,labels,fii,dii,prom){
  const el=document.getElementById(id);if(!el)return;dChart(id);
  const ds=[{label:'FII %',data:fii,borderColor:'#1E3A8A',borderWidth:2,pointRadius:3,tension:.3},{label:'DII %',data:dii,borderColor:'#0A4A2E',borderWidth:2,pointRadius:3,tension:.3}];
  if(prom.some(v=>v!=null&&v>0)) ds.push({label:'Promoter %',data:prom,borderColor:'#7C3AED',borderWidth:2,pointRadius:3,tension:.3});
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:ds},options:{...COPT}});
}

function drawCharts(){
  Object.keys(charts).forEach(k=>{try{charts[k].destroy();}catch(e){}delete charts[k];});
  if(page==='company'&&coData){
    const full=coData; const qs=full.quarters?.data||{};
    const scores=full._scores||{}; const isBank=scores.isBank;
    const qKeys=full.quarters?.headers||[];
    const qEPS=qKeys.map(h=>parseNum(qs['EPS in Rs']?.[h]));
    const qOPM=isBank?qKeys.map(h=>parseNum(qs['Financing Margin %']?.[h])):qKeys.map(h=>parseNum(qs['OPM %']?.[h]));
    const qGNPA=isBank?qKeys.map(h=>parseNum(qs['Gross NPA %']?.[h])):[];
    const qNNPA=isBank?qKeys.map(h=>parseNum(qs['Net NPA %']?.[h])):[];
    const shKeys=full.shareholding?.headers?.filter(h=>h&&h.trim())||[];
    const sh=full.shareholding?.data||{};
    const pl=full.profitLoss?.data||{};
    const ra=full.ratios?.data||{};
    const cf=full.cashFlow?.data||{};
    const annKeys=full.profitLoss?.headers||[];
    const cfKeys=full.cashFlow?.headers||[];
    const annRev=annKeys.map(y=>parseNum((isBank?pl['Revenue']:pl['Sales'])?.[y]));
    const annNP=annKeys.map(y=>parseNum(pl['Net Profit']?.[y]));
    const cfoArr=cfKeys.map(y=>parseNum(cf['Cash from Operating Activity']?.[y]));
    const fcfArr=cfKeys.map(y=>parseNum(cf['Free Cash Flow']?.[y]));
    const shFII=shKeys.map(h=>parseNum(sh['FIIs']?.[h]));
    const shDII=shKeys.map(h=>parseNum(sh['DIIs']?.[h]));
    const shProm=shKeys.map(h=>parseNum(sh['Promoters']?.[h]));
    const disp=k=>k.replace('Mar ','FY');

    if(coTab==='overview'){
      mkLine('co-qeps',qKeys,qEPS,'EPS ₹','#0A4A2E');
      if(isBank) mkDual('co-margin',qKeys,qGNPA,'Gross NPA %','#92400E',qNNPA,'Net NPA %','#991B1B');
      else mkLine('co-margin',qKeys,qOPM,'OPM %','#1E3A8A');
    }
    if(coTab==='financials'){
      mkBarLine('co-revnp',annKeys.map(disp),annRev,isBank?'Revenue':'Sales',annNP,'Net Profit');
      mkBars('co-cf',cfKeys.map(disp),cfoArr,'CFO',fcfArr,'FCF');
    }
    if(coTab==='ownership') mkOwn('co-own',shKeys,shFII,shDII,shProm);
  }
}
