<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivesify — Indian Stock Research</title>
<meta name="description" content="Free, data-driven Indian equity research. 1,400+ companies analysed daily on quality, value, momentum and more. No tips. No noise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0B1D3A;--ink2:#2D4060;--ink3:#7A8FA8;--ink4:#B8CADC;
  --paper:#F7F4EC;--paper2:#EDE8DC;--paper3:#E4DDD0;--card:#FDFBF6;
  --bd:#D6CFBF;--bd2:#E8E2D5;
  --green:#0A4A2C;--green2:#1A6B40;--greenl:#E4F2EB;--greend:#073D22;
  --amber:#8B3D00;--amber2:#B35000;--amberl:#FEF0E4;
  --navy:#1A3680;--navyl:#EBF0FF;
  --red:#8B1A1A;--red2:#B32020;--redl:#FDEAEA;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans','Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r4:4px;--r6:6px;--r8:8px;--r10:10px;--r12:12px;
}
html,body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--sans);cursor:pointer;border:none;outline:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--greenl);color:var(--green)}
img{display:block}

/* ── ANIMATIONS ─────────────────────────────────── */
.fade{animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide{animation:slideIn .2s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ── NAV ─────────────────────────────────────────── */
nav{background:var(--ink);position:sticky;top:0;z-index:300;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:54px;display:flex;align-items:center;gap:0}
.logo{font-family:var(--serif);font-size:18px;font-weight:600;color:#fff;cursor:pointer;background:none;padding:0;margin-right:32px;letter-spacing:.01em;white-space:nowrap}
.logo span{color:#4ADE80;font-style:italic}
.navlinks{display:flex;gap:2px;flex:1}
.nb{background:none;color:rgba(255,255,255,.42);font-size:13px;font-weight:400;padding:6px 12px;border-radius:var(--r6);transition:all .15s;letter-spacing:.01em}
.nb:hover{color:rgba(255,255,255,.78);background:rgba(255,255,255,.07)}
.nb.on{color:#fff;background:rgba(255,255,255,.11);font-weight:500}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav-dot{width:7px;height:7px;border-radius:50%;background:#4B5563;transition:all .3s;flex-shrink:0}
.nav-dot.live{background:#4ADE80;box-shadow:0 0 0 2px rgba(74,222,128,.25);animation:navpulse 2.5s infinite}
@keyframes navpulse{0%,100%{box-shadow:0 0 0 2px rgba(74,222,128,.25)}50%{box-shadow:0 0 0 5px rgba(74,222,128,0)}}
.nav-status{font-size:11px;color:rgba(255,255,255,.32);font-family:var(--mono)}

/* ── LAYOUT ──────────────────────────────────────── */
.page{max-width:1200px;margin:0 auto;padding:44px 24px 80px}
.pg-narrow{max-width:920px;margin:0 auto;padding:44px 24px 80px}

/* ── CARDS ───────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r10);padding:20px 22px}
.card-sm{background:var(--card);border:1px solid var(--bd);border-radius:var(--r8);padding:14px 16px}
.card-dark{background:var(--ink);border:1px solid var(--ink);border-radius:var(--r10);padding:24px 26px;color:#fff}
.card-hover{transition:border-color .15s,box-shadow .15s;cursor:pointer}
.card-hover:hover{border-color:var(--ink3);box-shadow:0 2px 12px rgba(0,0,0,.06)}

/* ── BADGES ──────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:20px;white-space:nowrap;line-height:20px}
.b-buy{background:var(--greenl);color:var(--green)}
.b-hold{background:var(--navyl);color:var(--navy)}
.b-watch{background:var(--amberl);color:var(--amber2)}
.b-avoid{background:var(--redl);color:var(--red)}
.b-signal{background:var(--greenl);color:var(--green)}
.b-closed{background:var(--navyl);color:var(--navy)}
.b-sector{background:var(--paper3);color:var(--ink2);font-weight:500;font-size:10px;padding:2px 8px}

/* ── TYPOGRAPHY ──────────────────────────────────── */
.label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;display:block}
.heading{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.15;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink2);line-height:1.65;margin-top:5px}
.mono{font-family:var(--mono)}

/* ── SCORE BARS ──────────────────────────────────── */
.sbar{margin-bottom:10px}
.sbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sbar-label{font-size:11px;color:var(--ink2)}
.sbar-val{font-family:var(--mono);font-size:12px;font-weight:600}
.sbar-track{height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;transition:width .8s ease}

/* ── STAT BOXES ──────────────────────────────────── */
.stat{padding:14px 16px;background:var(--paper2);border-radius:var(--r8);border:1px solid var(--bd2)}
.stat-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);line-height:1}
.stat-sub{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.4}

/* ── TABS ────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:3px;background:var(--paper2);border-radius:var(--r8);border:1px solid var(--bd);width:fit-content;margin-bottom:22px}
.tbtn{padding:6px 15px;border:none;background:transparent;color:var(--ink2);border-radius:var(--r6);font-size:12px;font-weight:500;transition:all .15s;letter-spacing:.01em}
.tbtn.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ── INFO TOOLTIPS ───────────────────────────────── */
.itip{position:relative;display:inline-flex;align-items:center;cursor:help;margin-left:4px;vertical-align:middle}
.itip-btn{width:15px;height:15px;border-radius:50%;background:var(--bd);color:var(--ink3);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.itip:hover .itip-btn{background:var(--ink3);color:#fff}
.itip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:240px;background:var(--ink);color:rgba(255,255,255,.9);padding:12px 14px;border-radius:var(--r8);font-size:11px;line-height:1.65;z-index:400;pointer-events:none;font-weight:400;text-transform:none;letter-spacing:0;white-space:normal;font-family:var(--sans);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.itip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.itip:hover .itip-box{display:block}
.itip-box strong{color:#fff;display:block;margin-bottom:4px;font-size:12px}
.itip-box em{color:rgba(255,255,255,.55);font-style:normal}

/* ── TABLE ───────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:9px 12px;border-bottom:2px solid var(--bd);font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:var(--paper2);user-select:none}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.sorted{color:var(--green)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.tbl .row-hover{cursor:pointer;transition:background .1s}
.tbl .row-hover:hover td{background:var(--greenl)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── SEARCH / FILTER ─────────────────────────────── */
.srch-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.srch-inp{padding:9px 14px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--card);font-size:13px;color:var(--ink);width:260px;transition:border-color .15s}
.srch-inp:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(26,107,64,.08)}
.srch-sel{padding:9px 12px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--card);font-size:12px;color:var(--ink2)}
.srch-count{font-size:12px;color:var(--ink3);margin-left:4px}
.clear-btn{font-size:12px;color:var(--red);background:none;padding:0;text-decoration:underline}

/* ── PAGINATION ──────────────────────────────────── */
.pag{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.pbtn{padding:5px 12px;border:1px solid var(--bd);border-radius:var(--r6);background:var(--card);font-size:12px;color:var(--ink);transition:all .15s}
.pbtn:hover:not(:disabled){border-color:var(--ink3)}
.pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbtn:disabled{opacity:.38;cursor:not-allowed}

/* ── DOC LINKS ───────────────────────────────────── */
.doc-link{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--bd2);border-radius:var(--r8);margin-bottom:6px;background:var(--card);transition:border-color .15s,background .15s}
.doc-link:hover{border-color:var(--ink3);background:var(--paper2)}
.doc-link-icon{font-size:16px;opacity:.45;flex-shrink:0}
.doc-link-text{font-size:13px;font-weight:500;color:var(--ink);flex:1}
.doc-link-arr{font-size:10px;opacity:.3}

/* ── GRID HELPERS ────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}

/* ── INSIGHT STRIP ───────────────────────────────── */
.insight{border-left:3px solid;padding:12px 16px;border-radius:0 var(--r6) var(--r6) 0;font-size:13px;line-height:1.65}
.insight-green{border-color:var(--green2);background:var(--greenl);color:var(--greend)}
.insight-amber{border-color:var(--amber2);background:var(--amberl);color:var(--amber)}
.insight-red{border-color:var(--red2);background:var(--redl);color:var(--red)}
.insight-blue{border-color:var(--navy);background:var(--navyl);color:var(--navy)}

/* ── PHILOSOPHY STRIP ────────────────────────────── */
.phil{background:var(--ink);border-radius:var(--r12);padding:32px 36px;position:relative;overflow:hidden}
.phil::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.02);pointer-events:none}

/* ── LOADER ──────────────────────────────────────── */
#loader{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
.ldot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block;margin:0 3px;animation:ldot 1.3s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.18s}.ldot:nth-child(3){animation-delay:.36s}
@keyframes ldot{0%,80%,100%{transform:scale(0);opacity:.25}40%{transform:scale(1);opacity:1}}

/* ── FOOTER ──────────────────────────────────────── */
footer{border-top:1px solid var(--bd2);padding:24px;margin-top:48px}
.foot-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

/* ── CHART CONTAINERS ────────────────────────────── */
.chart-box{position:relative;width:100%}

/* ── MOBILE ──────────────────────────────────────── */
@media(max-width:768px){
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .page,.pg-narrow{padding:24px 16px 60px}
  .nav-inner{padding:0 16px}
  .nb:nth-child(n+4){display:none}
  .hide-m{display:none}
  .srch-inp{width:100%}
  .srch-bar{flex-direction:column;align-items:flex-start}
  h1.hero-title{font-size:38px!important}
}
@media(min-width:769px){.show-m{display:none}}
</style>
</head>
<body>

<div id="loader">
  <div style="font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;margin-bottom:22px;letter-spacing:.01em">Nivesify<span style="color:#4ADE80;font-style:italic">.</span></div>
  <div><span class="ldot"></span><span class="ldot"></span><span class="ldot"></span></div>
  <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:18px;font-family:var(--mono)" id="lmsg">Loading...</div>
</div>

<nav>
  <div class="nav-inner">
    <button class="logo" onclick="go('home')">Nivesify<span>.</span></button>
    <div class="navlinks">
      <button class="nb on" id="nb-home"   onclick="go('home')">Home</button>
      <button class="nb"    id="nb-signals" onclick="go('signals')">Signals</button>
      <button class="nb"    id="nb-research" onclick="go('research')">Research</button>
      <button class="nb"    id="nb-record"  onclick="go('record')">Track Record</button>
    </div>
    <div class="nav-right">
      <div class="nav-dot" id="ndot"></div>
      <span class="nav-status" id="nstatus">—</span>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer>
  <div class="foot-inner">
    <div>
      <div style="font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px">Nivesify<span style="color:var(--green2);font-style:italic">.</span></div>
      <div style="font-size:11px;color:var(--ink3)">Free Indian equity research. 1,400+ companies scored daily from public BSE data. No tips, no noise.</div>
    </div>
    <div style="font-size:11px;color:var(--ink3);text-align:right;line-height:1.8">
      <div>Not SEBI registered · Not financial advice</div>
      <div>For research and educational purposes only</div>
    </div>
  </div>
</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   NIVESIFY — Complete frontend
   Data: ./data/index.json + ./history.json + ./data/{bse}.json
══════════════════════════════════════════════════════════════ */

// ── STATE ───────────────────────────────────────────
let IDX={}, HIST={activeCalls:[],closedCalls:[],dailySnapshots:[],stats:{},lastUpdated:null};
let COS=[], page='home', coId=null, coData=null, coTab='overview';
let sigTab='active', uP=1, uF={q:'',sig:'',sec:''}, srtK='ccs', srtD=-1;
let charts={};
const PER=50;
const BASE=window.location.pathname.replace(/\/[^\/]*$/,'');

// ── BOOT ────────────────────────────────────────────
async function boot(){
  lmsg('Loading market data...');
  try{
    const ts='?t='+Date.now();
    const [hR,iR]=await Promise.all([fetch(BASE+'/history.json'+ts),fetch(BASE+'/data/index.json'+ts)]);
    if(hR.ok)HIST=await hR.json();
    IDX=await iR.json();
    // Clean names + build list
    Object.values(IDX).forEach(c=>{
      c.name=cleanName(c.name)||c.id;
    });
    COS=Object.values(IDX).sort((a,b)=>b.ccs-a.ccs);
    const n=(HIST.activeCalls||[]).length;
    document.getElementById('ndot').className='nav-dot'+(n?'  live':'');
    document.getElementById('nstatus').textContent=n+' active signal'+(n!==1?'s':'');
    lmsg('Loaded '+COS.length.toLocaleString()+' companies');
    setTimeout(()=>{const l=document.getElementById('loader');l.style.opacity='0';setTimeout(()=>l.remove(),400);},300);
    r();
  }catch(e){lmsg('Error: '+e.message);console.error(e);}
}
function lmsg(m){const el=document.getElementById('lmsg');if(el)el.textContent=m;}

// ── NAME CLEANER ────────────────────────────────────
function cleanName(raw){
  if(!raw)return raw;
  let n=String(raw).replace(/[,;]+\s*$/,'').trim();
  if(n===n.toUpperCase()&&n.length>3){
    n=n.toLowerCase().replace(/\b(\w)/g,c=>c.toUpperCase());
    n=n.replace(/\bLtd\b(?!\.)/g,'Ltd.').replace(/\bLtd\.\./g,'Ltd.');
  }
  return n;
}

// ── ROUTING ─────────────────────────────────────────
function go(p){
  page=p;coId=null;coData=null;coTab='overview';uP=1;uF={q:'',sig:'',sec:''};srtK='ccs';srtD=-1;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById('nb-'+p);if(el)el.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});r();
}
async function goC(id){
  coId=id;coData=null;page='company';coTab='overview';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('nb-research').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});r();
  try{const res=await fetch(BASE+'/data/'+id+'.json?t='+Date.now());coData=await res.json();r();}
  catch(e){console.warn('Could not load company:',id);}
}
function setCoTab(t){coTab=t;r();}
function setSigTab(t){sigTab=t;r();}
function srt(k){srtD=(srtK===k)?-srtD:-1;srtK=k;uP=1;r();}

// ── RENDER ──────────────────────────────────────────
function r(){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};
  const app=document.getElementById('app');
  app.innerHTML='<div class="fade">'+rPage()+'</div>';
  setTimeout(drawAll,80);
}
function rPage(){
  if(page==='home')return rHome();
  if(page==='signals')return rSignals();
  if(page==='research')return rResearch();
  if(page==='company')return rCompany();
  if(page==='record')return rRecord();
  return '';
}

// ── HELPERS ─────────────────────────────────────────
const sC=s=>({BUY:'var(--green)',HOLD:'var(--navy)',WATCH:'var(--amber2)',AVOID:'var(--red)'}[s]||'var(--ink3)');
const sCls=s=>({BUY:'b-buy',HOLD:'b-hold',WATCH:'b-watch',AVOID:'b-avoid'}[s]||'');
const bdg=(l,c)=>`<span class="badge ${c}">${l}</span>`;
const fCr=n=>{if(n==null)return'—';const a=Math.abs(n);const s=a>=100000?`${(a/100000).toFixed(1)}L Cr`:a>=1000?`${(a/1000).toFixed(0)}K Cr`:`${Math.round(a)} Cr`;return(n<0?'−₹':'₹')+s;};
const pn=v=>{if(v==null)return null;if(typeof v==='number')return v;return parseFloat(String(v).replace(/%/g,'').replace(/,/g,''))||null;};
const lN=(o,n)=>{if(!o)return[];return Object.values(o).slice(-n).map(pn).filter(v=>v!=null);};
const fDate=d=>{if(!d)return'—';const[y,m,dy]=d.split('-');const mo='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');return`${dy} ${mo[+m-1]} ${y}`;};
const ev=v=>{if(!v)return null;return parseInt(String(v).replace('+',''));};
const pct=v=>v!=null?v+'%':'—';
const sBar=(l,v,c,w=100)=>`<div class="sbar"><div class="sbar-row"><span class="sbar-label">${l}</span><span class="sbar-val" style="color:${c}">${v}/${w}</span></div><div class="sbar-track"><div class="sbar-fill" style="width:${(v/w)*100}%;background:${c}"></div></div></div>`;
const iTip=(title,body)=>`<span class="itip"><span class="itip-btn">i</span><span class="itip-box"><strong>${title}</strong>${body}</span></span>`;
const signalLabel=s=>({BUY:'Strong Buy',HOLD:'Hold',WATCH:'Watch',AVOID:'Avoid'}[s]||s);

// ── SECTOR FILTER HELPER ─────────────────────────────
function getFiltered(){
  return [...COS].filter(c=>{
    if(uF.q&&!c.name.toLowerCase().includes(uF.q.toLowerCase())&&!c.id.includes(uF.q))return false;
    if(uF.sig&&c.signal!==uF.sig)return false;
    if(uF.sec&&c.sector!==uF.sec)return false;
    return true;
  }).sort((a,b)=>{
    const av=a[srtK]??-9999,bv=b[srtK]??-9999;
    if(typeof av==='string')return av.localeCompare(bv)*srtD;
    return(bv-av)*-srtD;
  });
}

// ── SHAREHOLDING HEADERS FIX ─────────────────────────
function getQtrShHeaders(full){
  const all=full?.shareholding?.headers||[];
  const sepIdx=all.findIndex(h=>!h||!h.trim());
  return(sepIdx===-1?all:all.slice(0,sepIdx)).filter(h=>h&&h.trim()&&/[A-Z][a-z]+ \d{4}/.test(h));
}

/* ══════════════════════════════════════════════════════
   HOME PAGE
══════════════════════════════════════════════════════ */
function rHome(){
  const active=HIST.activeCalls||[];
  const updated=HIST.lastUpdated||'Not yet updated';

            <button onclick="go('signals')" style="padding:11px 20px;background:transparent;color:var(--ink);border:1.5px solid var(--bd);border-radius:var(--r8);font-size:13px">Past signals</button>

      <div>
        ${top&&meta?`

      ${[

      <div class="tbl-wrap">

            <th style="min-width:180px">Company</th>

            <th>Value ${iTip('Value Score','Measures how undervalued the stock is. The main input is the gap between how fast profits grew vs how fast the stock price moved. When earnings grow faster than price for years, value accumulates unseen.<br><em>Example: Profits up 19% p.a., stock flat for 5 years = high value score.</em>')}</th>
            <th class="hide-m">Momentum ${iTip('Momentum Score','Tracks whether foreign and domestic institutional investors are buying or selling, and whether quarterly earnings are growing or shrinking.<br><em>Example: FII holding rising 3 quarters in a row = positive momentum.</em>')}</th>
            <th>Score ${iTip('Conviction Score (CCS)','The combined verdict: Quality×45% + Value×35% + Momentum×20%. A higher weight on quality ensures cheap bad businesses never rank highly.<br><em>Example: Q=75, V=80, M=55 → CCS = 72.</em>')}</th>
            <th>Signal</th>
            <th class="hide-m">Earn. gap ${iTip('Earnings vs Price Gap (EV-MED)','5-year profit growth rate minus 5-year stock price growth rate. A large positive number means profits have grown much faster than the stock price — a potential undervaluation signal.<br><em>Example: Profits CAGR +19%, Price CAGR 0% → gap = +19.</em>')}</th>
            <th class="hide-m">Profit 5Y</th>
            <th>ROE ${iTip('Return on Equity','Net profit divided by shareholders equity. Tells you how efficiently a company generates profit from money invested by shareholders. Higher is better; consistent is important.<br><em>Example: ROE of 18% means the company earns ₹18 for every ₹100 of shareholder money.</em>')}</th>
          </tr></thead>
          <tbody>
          ${COS.slice(0,10).map((c,i)=>`

              <td>${bdg(c.sector,'b-sector')}</td>

              <td><b class="mono" style="font-size:17px;color:${sC(c.signal)}">${c.ccs}</b></td>
              <td>${bdg(signalLabel(c.signal),sCls(c.signal))}</td>
              <td class="hide-m"><span class="mono" style="font-weight:600;color:${c.evmed&&c.evmed.toString().startsWith('-')?'var(--red)':'var(--green2)'}">${c.evmed||'—'}</span></td>
              <td class="hide-m"><span class="mono">${c.pcagr5!=null?c.pcagr5+'%':'—'}</span></td>
              <td><span class="mono">${c.roe!=null?c.roe+'%':'—'}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- SECTOR BREAKDOWN -->
    <div style="margin-bottom:52px">
      <div class="label" style="margin-bottom:14px">Coverage by sector</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">
        ${topSectors.map(([s,n])=>`
          <div class="card card-hover" onclick="uF.sec='${s}';go('research')" style="padding:12px 14px">

            <div class="mono" style="font-size:20px;font-weight:600;color:var(--ink)">${n}</div>
            <div style="font-size:10px;color:var(--ink3);margin-top:2px">companies</div>
          </div>`).join('')}
        ${topSectors.length<sectors.length?`<div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="go('research')"><div style="font-size:12px;color:var(--ink3)">+${sectors.length-5} more sectors →</div></div>`:''}
      </div>
    </div>

    <!-- PHILOSOPHY -->
    <div class="phil">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:36px">
        ${[
          ['"Price is what you pay. Value is what you get."','Warren Buffett','Our Value Score measures exactly this — the gap between what the market charges and what the business earns. When earnings grow at 19% but the stock goes nowhere for 5 years, something is mispriced.'],
          ['"In the short run the market is a voting machine. In the long run, it is a weighing machine."','Benjamin Graham','We measure the weighing machine — earnings, cash flow, return on capital — not the voting machine (sentiment, momentum, tips).'],
          ['"The key to investing is not assessing how much an industry is going to affect society, but rather determining the competitive advantage of any given company."','Warren Buffett','That is what the Quality Score measures: sustainable competitive advantage, expressed in consistent returns on capital over years.']
        ].map(([q,a,n])=>`
          <div>

            <div style="font-size:11px;color:rgba(255,255,255,.36);line-height:1.65;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)">${n}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function rSignals(){

  const closed=HIST.closedCalls||[];
  return `<div class="pg-narrow">
    <div style="margin-bottom:28px">
      <div class="label">Engine output</div>
      <div class="heading" style="font-size:30px;margin-bottom:8px">Conviction Signals</div>
      <div class="sub">A signal appears when a company simultaneously passes all four criteria below. No human picks these — the engine scores every company every night and flags what qualifies.</div>
    </div>
    <div style="background:var(--paper2);border:1px solid var(--bd);border-radius:var(--r8);padding:14px 18px;margin-bottom:24px">
      <div style="font-size:12px;font-weight:600;color:var(--ink);margin-bottom:10px">Four criteria — all must pass at the same time:</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[
          ['Signal rating = Strong Buy','The combined conviction score places it in the top category'],
          ['Quality Score ≥ 60','The business has proven consistency over 8+ years'],
          ['Conviction Score ≥ 65','The weighted composite score crosses the conviction bar'],
          ['Earnings growing faster than price','The earnings vs price gap (EV-MED) is +5 or above'],
        ].map(([t,d])=>`<div style="display:flex;gap:8px;font-size:12px"><span style="color:var(--green2);flex-shrink:0;margin-top:1px">✓</span><div><strong>${t}</strong><br><span style="color:var(--ink2)">${d}</span></div></div>`).join('')}
      </div>
    </div>
    <div class="tabs">
      ${[['active','Active ('+active.length+')'],['closed','Past signals ('+closed.length+')']].map(([k,l])=>
        `<button class="tbtn${sigTab===k?' on':''}" onclick="setSigTab('${k}')">${l}</button>`).join('')}
    </div>
    ${sigTab==='active'?rActiveSignals(active):rClosedSignals(closed)}
  </div>`;
}

function rActiveSignals(active){
  if(!active.length) return `
    <div style="text-align:center;padding:60px 20px">
      <div style="font-family:var(--serif);font-size:56px;font-weight:400;color:var(--bd);margin-bottom:16px;line-height:1">No active signals.</div>

      </div>
      <div style="display:inline-block;text-align:left;padding:18px 22px;background:var(--paper2);border-radius:var(--r8);border:1px solid var(--bd);font-size:13px;color:var(--ink2);max-width:400px;margin-bottom:26px">
        <div style="font-weight:600;color:var(--ink);margin-bottom:10px">What the engine is checking every night:</div>
        ${['Business quality consistent over 8+ years','Earnings growing significantly faster than price','Overall conviction score above 65','For banks: bad loan ratio under 3%'].map(t=>`<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--green2)">✓</span>${t}</div>`).join('')}
      </div>
      <br>
      <button onclick="go('research')" style="padding:10px 24px;background:var(--ink);color:#fff;border-radius:var(--r8);font-size:13px;font-weight:600">Explore all ${COS.length.toLocaleString()} companies →</button>
    </div>`;

  return active.map(meta=>{

    return `<div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px">
        <div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
            ${bdg('Active Signal','b-signal')} ${bdg(signalLabel(co.signal),sCls(co.signal))}
            <span style="font-size:11px;color:var(--ink3)">Detected ${fDate(meta.entryDate)}</span>
          </div>
          <div class="heading" style="font-size:26px;margin-bottom:3px">${co.name}</div>
          <div style="font-size:12px;color:var(--ink2)">${co.sector} · BSE ${co.id}</div>
        </div>
        <button onclick="goC('${co.id}')" style="padding:8px 16px;background:var(--paper2);border:1px solid var(--bd);border-radius:var(--r6);font-size:12px;color:var(--ink)">Full analysis →</button>
      </div>
      <div class="g2" style="margin-bottom:14px">
        <div>
          ${sBar('Quality — business strength',meta.entryScores?.qScore||co.qScore,'var(--green2)')}
          ${sBar('Value — degree of undervaluation',meta.entryScores?.vScore||co.vScore,'var(--navy)')}
          ${sBar('Momentum — institutional activity',meta.entryScores?.mScore||co.mScore,'#6D28D9')}
          <div style="background:var(--paper2);border-radius:var(--r6);padding:10px 12px;margin-top:5px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--ink2)">Conviction Score</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="mono" style="font-size:22px;font-weight:700;color:${sC(co.signal)}">${meta.entryScores?.ccs||co.ccs}</span>
              ${bdg(signalLabel(co.signal),sCls(co.signal))}

        <div class="g2">
          <div class="stat"><div class="stat-label">Earnings vs Price gap</div><div class="stat-val" style="color:var(--green2)">${meta.entryScores?.evmed||co.evmed||'—'}</div><div class="stat-sub">Profits outrunning price</div></div>

          <div class="stat"><div class="stat-label">Stock price 1 year</div><div class="stat-val" style="color:${(meta.priceCagr1Y||0)<0?'var(--red)':'var(--ink)'}">${meta.priceCagr1Y!=null?meta.priceCagr1Y+'%':'—'}</div><div class="stat-sub">Price change</div></div>

          `<div class="stat"><div class="stat-label">Profit CAGR 5Y</div><div class="stat-val">${co.pcagr5!=null?co.pcagr5+'%':'—'}</div><div class="stat-sub">5-year growth</div></div>`}
        </div>
      </div>
      <div class="insight insight-green"><strong>Why this passed:</strong> All four criteria were met simultaneously on ${fDate(meta.entryDate)}. The signal closes automatically the day any criterion breaks.</div>

}

function rClosedSignals(closed){
  if(!closed.length)return`<div style="text-align:center;padding:50px 20px"><div style="font-size:14px;color:var(--ink2);margin-bottom:8px">No past signals yet.</div><div style="font-size:12px;color:var(--ink3);max-width:360px;margin:0 auto">When an active signal drops below any threshold, it will be recorded here automatically with the full data.</div></div>`;
  return `<div>
    <div class="insight insight-green" style="margin-bottom:16px">Every signal that has opened and closed, with entry date, exit date, scores at both points, and the reason for closing — all automatically logged.</div>
    ${[...closed].reverse().map((c,i)=>`
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="display:flex;gap:7px;align-items:center;margin-bottom:5px">${bdg('Signal Closed','b-closed')}</div>

          <div style="text-align:right"><div class="mono" style="font-size:11px;color:var(--ink3)">${fDate(c.entryDate)} → ${fDate(c.exitDate)}</div>${c.exitScores?.signal?bdg(signalLabel(c.exitScores.signal),sCls(c.exitScores.signal)):''}</div>
        </div>
        <div class="g4" style="margin-bottom:10px">
          <div class="stat"><div class="stat-label">Score at open</div><div class="stat-val">${c.entryScores?.ccs||'—'}/100</div></div>
          <div class="stat"><div class="stat-label">Score at close</div><div class="stat-val" style="color:${(c.exitScores?.ccs||0)<(c.entryScores?.ccs||0)?'var(--red)':'var(--green2)'}">${c.exitScores?.ccs||'—'}/100</div></div>
          <div class="stat"><div class="stat-label">Earnings gap at open</div><div class="stat-val">${c.entryScores?.evmed||'—'}</div></div>
          <div class="stat"><div class="stat-label">Price trend at close</div><div class="stat-val" style="color:${(c.priceCagr1YAtExit||0)>0?'var(--green2)':'var(--red)'}">${c.priceCagr1YAtExit!=null?c.priceCagr1YAtExit+'%':'—'}</div></div>
        </div>

      </div>`).join('')}
  </div>`;
}

            </th>
            <th class="sortable${srtK==='mScore'?' sorted':''} hide-m" onclick="srt('mScore')">

            <th class="sortable${srtK==='ccs'?' sorted':''}" onclick="srt('ccs')">

          <tbody>

              <td><b class="mono" style="font-size:17px;color:${sC(c.signal)}">${c.ccs}</b></td>
              <td>${bdg(signalLabel(c.signal),sCls(c.signal))}</td>
              <td class="hide-m"><span class="mono" style="font-weight:600;color:${c.evmed&&c.evmed.toString().startsWith('-')?'var(--red)':'var(--green2)'}">${c.evmed||'—'}</span></td>
              <td class="hide-m"><span class="mono">${c.pcagr5!=null?c.pcagr5+'%':'—'}</span></td>
              <td><span class="mono">${c.roe!=null?c.roe+'%':'—'}</span></td>
              <td class="hide-m"><span class="mono" style="color:${(c.pricagr1||0)<0?'var(--red)':'var(--ink)'}">${c.pricagr1!=null?c.pricagr1+'%':'—'}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    ${totalPages>1?`<div class="pag">
      <button class="pbtn" onclick="uP=Math.max(1,uP-1);r()" ${uP===1?'disabled':''}>← Prev</button>
      ${Array.from({length:Math.min(7,totalPages)},(_,i)=>{const p=Math.max(1,Math.min(totalPages-6,uP-3))+i;return p<1||p>totalPages?'':`<button class="pbtn${p===uP?' on':''}" onclick="uP=${p};r()">${p}</button>`;}).join('')}
      <button class="pbtn" onclick="uP=Math.min(totalPages,uP+1);r()" ${uP===totalPages?'disabled':''}>Next →</button>
      <span style="font-size:11px;color:var(--ink3);margin-left:6px">Page ${uP} of ${totalPages} · ${total.toLocaleString()} results</span>
    </div>`:''}
    <div style="margin-top:16px;padding:12px 16px;background:var(--paper2);border-radius:var(--r8);font-size:12px;color:var(--ink2)">
      <strong>Note on sector distribution:</strong> Financial sector companies (banks, NBFCs) currently dominate the top of this list. This reflects the data: many quality Indian financial businesses have seen stock prices stagnate while earnings grew strongly, creating large value gaps. This is what the scoring engine finds, not an editorial choice.
    </div>
  </div>`;
}

function rCoOv(co,full,isBank,isCall,callR){
  if(!full)return'<div style="padding:40px;text-align:center;color:var(--ink3);font-style:italic">Loading detailed data...</div>';
  const qs=full.quarters?.data||{};
  const qKeys=full.quarters?.headers||[];
  const qEPS=qKeys.map(h=>pn(qs['EPS in Rs']?.[h]));
  const qOPM=isBank?qKeys.map(h=>pn(qs['Financing Margin %']?.[h])):qKeys.map(h=>pn(qs['OPM %']?.[h]));
  const qGNPA=isBank?qKeys.map(h=>pn(qs['Gross NPA %']?.[h])):[];
  const qNNPA=isBank?qKeys.map(h=>pn(qs['Net NPA %']?.[h])):[];
  const cag=full.CAGRs||{};
  const pros=full.analysis?.pros||[];
  const cons=full.analysis?.cons||[];
  const pl=full.profitLoss?.data||{};
  const ra=full.ratios?.data||{};
  const cf=full.cashFlow?.data||{};
  const bs=full.balanceSheet?.data||{};

  const latEPS=qEPS.filter(v=>v!=null).slice(-1)[0];
  const prevEPS=qEPS.filter(v=>v!=null).slice(-5,-4)[0];
  const epsYoY=(latEPS!=null&&prevEPS!=null&&prevEPS!==0)?((latEPS-prevEPS)/Math.abs(prevEPS)*100).toFixed(1)+'%':'—';

  // Compute extra investor metrics
  const npArr=Object.values(pl['Net Profit']||{}).map(pn).filter(v=>v!=null);
  const posYears=npArr.filter((v,i)=>i>0&&v>npArr[i-1]).length;
  const earnCon=npArr.length>1?Math.round((posYears/(npArr.length-1))*100)+'%':'—';

  const cfoArr=Object.values(cf['Cash from Operating Activity']||{}).slice(-5).map(pn).filter(v=>v!=null);
  const np5Arr=Object.values(pl['Net Profit']||{}).slice(-5).map(pn).filter(v=>v!=null);
  let cfii='—';
  if(cfoArr.length&&np5Arr.length){
    const ratios=cfoArr.map((c,i)=>np5Arr[i]&&np5Arr[i]!==0?c/np5Arr[i]:null).filter(v=>v!=null);
    if(ratios.length)cfii=(ratios.reduce((a,b)=>a+b,0)/ratios.length).toFixed(2);
  }

  const roeVals=Object.values(ra['ROE %']||{}).map(pn).filter(v=>v!=null);
  const roeRecent=roeVals.slice(-3);
  const roePrior=roeVals.slice(-6,-3);
  const roeTrend=roeRecent.length&&roePrior.length?(roeRecent.reduce((a,b)=>a+b)/roeRecent.length)>(roePrior.reduce((a,b)=>a+b)/roePrior.length)?'Improving':'Declining':'—';

  const latGNPA=qGNPA.filter(v=>v!=null).slice(-1)[0];
  const latNNPA=qNNPA.filter(v=>v!=null).slice(-1)[0];

  return `<div class="g2" style="margin-bottom:16px">
    <div class="card">
      <div class="label" style="margin-bottom:8px">Earnings per share — quarterly (₹) ${iTip('Quarterly EPS','Profit earned per share in each 3-month period. A steadily rising line shows consistent earnings growth. Flat or declining means earnings are stalling.')}</div>
      <div class="chart-box"><canvas id="co-qeps" style="height:140px"></canvas></div>
      <div class="g3" style="margin-top:12px">
        <div class="stat"><div class="stat-label">Latest quarter EPS</div><div class="stat-val">₹${latEPS||'—'}</div></div>
        <div class="stat"><div class="stat-label">Year-on-year growth</div><div class="stat-val" style="color:${parseFloat(epsYoY)>0?'var(--green2)':'var(--red)'}">${epsYoY}</div></div>
        <div class="stat"><div class="stat-label">Earnings vs Price gap</div><div class="stat-val" style="color:${co.evmed&&co.evmed.toString().startsWith('-')?'var(--red)':'var(--green2)'}">${co.evmed||'—'}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:8px">${isBank?'Bad loan (NPA) trend — %':'Operating profit margin — %'} ${isBank?iTip('NPA Trend','NPA = Non-Performing Assets = bad loans. A declining NPA ratio means the bank is recovering or avoiding bad debts. Gross NPA is total bad loans; Net NPA is after provisions.<br><em>Below 1.5% Net NPA is excellent for an Indian bank.</em>'):iTip('Operating Margin','What percentage of revenue becomes operating profit after all operating costs. A stable or rising margin over years shows pricing power and cost discipline.')}</div>
      <div class="chart-box"><canvas id="co-margin" style="height:140px"></canvas></div>
      ${isBank?`<div class="g2" style="margin-top:12px">
        <div class="stat" style="background:var(--amberl)"><div class="stat-label" style="color:var(--amber2)">Gross bad loans</div><div class="stat-val" style="color:var(--amber2)">${latGNPA!=null?latGNPA+'%':'—'}</div><div class="stat-sub">Latest quarter</div></div>
        <div class="stat" style="background:var(--greenl)"><div class="stat-label" style="color:var(--green)">Net bad loans</div><div class="stat-val" style="color:var(--green)">${latNNPA!=null?latNNPA+'%':'—'}</div><div class="stat-sub">After provisions</div></div>
      </div>`:`<div class="g2" style="margin-top:12px">
        <div class="stat"><div class="stat-label">Latest margin</div><div class="stat-val">${qOPM.filter(v=>v!=null).slice(-1)[0]!=null?qOPM.filter(v=>v!=null).slice(-1)[0]+'%':'—'}</div></div>
        <div class="stat"><div class="stat-label">Return on equity</div><div class="stat-val">${co.roe!=null?co.roe+'%':'—'}</div></div>
      </div>`}
    </div>
  </div>

  <!-- EXTRA INVESTOR METRICS -->
  <div class="card" style="margin-bottom:16px">
    <div class="label" style="margin-bottom:14px">Key investor metrics ${iTip('Why these metrics?','These go beyond headline numbers. Earnings consistency shows if a company has ever had a loss year. Cash conversion shows if profits are real (backed by actual cash). ROE trend shows if returns are improving or declining.')}</div>
    <div class="g4">
      <div class="stat">
        <div class="stat-label">Earnings consistency ${iTip('Earnings Consistency','What % of years did net profit grow vs the prior year. 100% means every single year showed profit growth — a mark of a truly durable business.<br><em>80%+ over 10 years is rare and valuable.</em>')}</div>
        <div class="stat-val" style="color:${parseInt(earnCon)>=80?'var(--green2)':parseInt(earnCon)>=60?'var(--amber2)':'var(--red)'}">${earnCon}</div>
        <div class="stat-sub">Years with profit growth</div>
      </div>
      <div class="stat">
        <div class="stat-label">Cash flow integrity ${iTip('Cash Flow Integrity (CFII)','5-year average ratio of operating cash flow to net profit. A ratio close to 1.0 means profits are backed by real cash. Below 0.6 is a warning sign that earnings may be overstated.<br><em>1.0 = profits and cash are in sync.</em>')}</div>
        <div class="stat-val" style="color:${parseFloat(cfii)>=0.8?'var(--green2)':parseFloat(cfii)>=0.6?'var(--amber2)':'var(--red)'}">${cfii}</div>
        <div class="stat-sub">CFO ÷ Net profit (5Y avg)</div>
      </div>
      <div class="stat">
        <div class="stat-label">ROE trend ${iTip('Return on Equity Trend','Comparing ROE of the last 3 years vs the 3 years before that. Improving = the business is getting more efficient. Declining = watch carefully.')}</div>
        <div class="stat-val" style="font-size:14px;color:${roeTrend==='Improving'?'var(--green2)':'var(--red)'}">${roeTrend}</div>
        <div class="stat-sub">Last 3Y vs prior 3Y</div>
      </div>
      <div class="stat">
        <div class="stat-label">Return on equity ${iTip('Return on Equity (ROE)','Net profit ÷ total equity. The higher and more consistent over time, the better. Consistent 15%+ ROE over many years signals a compounding machine.')}</div>
        <div class="stat-val">${co.roe!=null?co.roe+'%':'—'}</div>
        <div class="stat-sub">Latest year</div>
      </div>
    </div>
  </div>

  <!-- GROWTH RATES -->
  <div class="card" style="margin-bottom:16px">
    <div class="label" style="margin-bottom:12px">Compounded annual growth rates ${iTip('CAGR','Compounded Annual Growth Rate — the smoothed year-on-year growth rate over a period. Revenue and profit CAGR should be positive and ideally above 12%. When profit CAGR far exceeds price CAGR, a valuation opportunity may exist.')}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0">
      ${[['Revenue growth',cag['Compounded Sales Growth']||{}],['Profit growth',cag['Compounded Profit Growth']||{}],['Stock price growth',cag['Stock Price CAGR']||{}],['Return on equity',cag['Return on Equity']||{}]].map(([grp,d],gi)=>`
        <div style="padding:0 18px;border-right:${gi<3?'1px solid var(--bd2)':'none'}">
          <div style="font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:10px">${grp}</div>
          ${Object.entries(d).map(([k,v])=>`
            <div style="display:flex;justify-content:space-between;margin-bottom:7px">
              <span style="font-size:11px;color:var(--ink3)">${k}</span>
              <span class="mono" style="font-size:12px;font-weight:600;color:${v&&String(v).startsWith('-')?'var(--red)':'var(--ink)'}">${v||'—'}</span>
            </div>`).join('')}
        </div>`).join('')}
    </div>
  </div>

  <!-- PROS / CONS -->
  <div style="display:grid;grid-template-columns:1fr 1fr${isCall?' 1fr':''};gap:14px">
    <div class="card">
      <div class="label" style="color:var(--green2);margin-bottom:10px">What the data says in its favour</div>

const CBASE={
  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#0B1D3A',titleColor:'rgba(255,255,255,.5)',bodyColor:'#fff',padding:10,cornerRadius:6,displayColors:false}},
  scales:{
    x:{ticks:{color:'#7A8FA8',font:{size:9,family:'JetBrains Mono'}},grid:{display:false},border:{display:false}},
    y:{ticks:{color:'#7A8FA8',font:{size:9,family:'JetBrains Mono'}},grid:{color:'#E4DDD0'},border:{display:false}}
  }
};

function mkLine(id,labels,data,name,color){
  const el=document.getElementById(id);if(!el)return;
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:name,data,borderColor:color,borderWidth:2.5,pointRadius:0,tension:.35,fill:true,backgroundColor:color+'15',pointHoverRadius:4,pointHoverBackgroundColor:color}]},options:{...CBASE}});
}
function mkDual(id,labels,d1,n1,c1,d2,n2,c2){
  const el=document.getElementById(id);if(!el)return;
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:n1,data:d1,borderColor:c1,borderWidth:2,pointRadius:0,tension:.35},{label:n2,data:d2,borderColor:c2,borderWidth:1.5,borderDash:[4,3],pointRadius:0,tension:.35}]},options:{...CBASE}});
}
function mkBarLine(id,labels,bars,bN,line,lN){
  const el=document.getElementById(id);if(!el)return;
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{type:'bar',label:bN,data:bars,backgroundColor:'#D6CFBF',borderRadius:3,barPercentage:.6},{type:'line',label:lN,data:line,borderColor:'#0A4A2C',borderWidth:2.5,pointRadius:0,tension:.3,yAxisID:'y1'}]},options:{...CBASE,scales:{...CBASE.scales,y1:{position:'right',ticks:{color:'#0A4A2C',font:{size:9}},grid:{display:false},border:{display:false}}}}});
}
function mkBars(id,labels,d1,n1,d2,n2){
  const el=document.getElementById(id);if(!el)return;
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:n1,data:d1,backgroundColor:'#0A4A2C',borderRadius:3,barPercentage:.5},{label:n2,data:d2,backgroundColor:'#1A6B40',borderRadius:3,barPercentage:.5}]},options:{...CBASE}});
}
function mkOwn(id,labels,fii,dii,prom){
  const el=document.getElementById(id);if(!el)return;
  const ds=[
    {label:'FII %',data:fii,borderColor:'#1A3680',borderWidth:2,pointRadius:3,pointBackgroundColor:'#1A3680',tension:.35},
    {label:'DII %',data:dii,borderColor:'#0A4A2C',borderWidth:2,pointRadius:3,pointBackgroundColor:'#0A4A2C',tension:.35}
  ];
  if(prom.some(v=>v!=null&&v>0))ds.push({label:'Promoter %',data:prom,borderColor:'#6D28D9',borderWidth:2,pointRadius:3,pointBackgroundColor:'#6D28D9',tension:.35});
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:ds},options:{...CBASE}});
}

function drawAll(){
  if(page!=='company'||!coData)return;
  const full=coData;
  const qs=full.quarters?.data||{};
  const isBank=full._scores?.isBank||false;
  const qKeys=full.quarters?.headers||[];
  const shKeys=getQtrShHeaders(full); // FIXED: only quarterly headers
  const sh=full.shareholding?.data||{};
  const pl=full.profitLoss?.data||{};
  const cf=full.cashFlow?.data||{};
  const annKeys=full.profitLoss?.headers||[];
  const cfKeys=full.cashFlow?.headers||[];
  const disp=k=>k.replace('Mar ','FY');

  if(coTab==='overview'){
    mkLine('co-qeps',qKeys,qKeys.map(h=>pn(qs['EPS in Rs']?.[h])),'EPS ₹','#0A4A2C');
    if(isBank) mkDual('co-margin',qKeys,qKeys.map(h=>pn(qs['Gross NPA %']?.[h])),'Gross NPA %','#B35000',qKeys.map(h=>pn(qs['Net NPA %']?.[h])),'Net NPA %','#8B1A1A');
    else mkLine('co-margin',qKeys,qKeys.map(h=>pn(qs['OPM %']?.[h])),'OPM %','#1A3680');
  }
  if(coTab==='financials'){
    mkBarLine('co-revnp',annKeys.map(disp),annKeys.map(y=>pn((isBank?pl['Revenue']:pl['Sales'])?.[y])),isBank?'Revenue':'Sales',annKeys.map(y=>pn(pl['Net Profit']?.[y])),'Profit');
    mkBars('co-cf',cfKeys.map(disp),cfKeys.map(y=>pn(cf['Cash from Operating Activity']?.[y])),'Operating CF',cfKeys.map(y=>pn(cf['Free Cash Flow']?.[y])),'Free CF');
  }
  if(coTab==='ownership'){
    // FIXED: Use only quarterly shareholding headers
    const fii=shKeys.map(h=>pn(sh['FIIs']?.[h]));
    const dii=shKeys.map(h=>pn(sh['DIIs']?.[h]));
    const prom=shKeys.map(h=>pn(sh['Promoters']?.[h]));
    mkOwn('co-own',shKeys,fii,dii,prom);
  }
}

// ── GLOBALS ──────────────────────────────────────
window.go=go;window.goC=goC;window.setCoTab=setCoTab;window.setSigTab=setSigTab;window.srt=srt;
boot();
</script>
